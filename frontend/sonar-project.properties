# SonarQube: analisis de calidad del frontend (HTML, CSS y JavaScript).
# Antes de analizar, generar la cobertura desde esta carpeta:  npm run test:cobertura
# Luego ejecutar SonarScanner desde esta carpeta. Ver docs/informes/Proyecto final/auditoria.
sonar.projectKey=grupo3-sazloop-frontend
sonar.projectName=GRUPO 3 FRONT
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Codigo del grupo y sus pruebas
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Librerias de terceros, pruebas y archivos generados (no se cuentan como codigo fuente)
sonar.exclusions=app/vendor/**,tests/**,coverage/**,node_modules/**,dist/**,package.json

# Cobertura de las pruebas unitarias (generada con npm run test:cobertura)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
